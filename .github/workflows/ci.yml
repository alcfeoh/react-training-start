name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, build, and unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      # Jumbotron.test.js is an intentional TDD lab that fails on a fresh clone.
      # CI runs the rest of the Vitest suite (CurrencyDropdown, CartView, etc.).
      - name: Unit tests
        run: npm run test:ci
